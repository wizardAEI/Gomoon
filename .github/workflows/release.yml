# 推送 tag (如 v1.3.2) 时构建并发布到 GitHub Releases
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Prepare resources (if missing)
        if: hashFiles('resources/**') == ''
        run: |
          node -e '
          const fs = require("fs");
          fs.mkdirSync("resources", { recursive: true });
          fs.writeFileSync("resources/assistants.json", JSON.stringify({ assistants: [], selectedAssistantForAns: "", selectedAssistantForChat: "" }));
          fs.writeFileSync("resources/lines.json", JSON.stringify({ lines: [] }));
          fs.writeFileSync("resources/memories.json", JSON.stringify({ memories: [], selectedMemo: "" }));
          const png = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==", "base64");
          fs.writeFileSync("resources/icon.png", png);
          fs.writeFileSync("resources/icon@20.png", png);
          '

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Resize icon for macOS
        if: matrix.platform == 'mac'
        run: sips -z 512 512 resources/icon.png

      - name: Build app (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Build app (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
