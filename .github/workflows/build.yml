name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      # 若 resources 未提交到仓库，创建最小 stub 供 CI 打包使用
      - name: Prepare resources (if missing)
        if: hashFiles('resources/**') == ''
        run: |
          node -e '
          const fs = require("fs");
          fs.mkdirSync("resources", { recursive: true });
          fs.writeFileSync("resources/assistants.json", JSON.stringify({ assistants: [], selectedAssistantForAns: "", selectedAssistantForChat: "" }));
          fs.writeFileSync("resources/lines.json", JSON.stringify({ lines: [] }));
          fs.writeFileSync("resources/memories.json", JSON.stringify({ memories: [], selectedMemo: "" }));
          const png = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==", "base64");
          fs.writeFileSync("resources/icon.png", png);
          fs.writeFileSync("resources/icon@20.png", png);
          '

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # macOS 需要至少 512x512 的 icon.png，用系统 sips 放大 stub
      - name: Resize icon for macOS
        if: matrix.platform == 'mac'
        run: sips -z 512 512 resources/icon.png

      - name: Build installer (${{ matrix.platform }})
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win
          else
            npx electron-builder --mac
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomoon-${{ matrix.platform }}-${{ github.sha }}
          path: release/
